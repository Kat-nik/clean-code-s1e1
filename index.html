<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <div class="about-content">
      <img class="about-img" src="./eisenhower-matrix.jpg" alt="card about todo list">
      <a class="about-link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
    <div class="todo">
      <p id="container-adding">
        <label for="new-task">Add Item</label>
        <div class="task-wrapper">
          <input 
            id="new-task"
            class="task input"
            type="text"
          >
          <button class="button">Add</button>
        </div>
      </p>
      <h3 class="subtitle">Todo</h3>
      <ul id="incomplete-tasks" class="todo-list">
        <li class="list-item">
          <input type="checkbox" class="input checkbox">
          <label class="task">Pay Bills</label>
          <input type="text" class="task input">
          <button class="edit button">Edit</button>
          <button class="delete button">
            <img class="img-btn" src="./remove.svg">
          </button>
        </li>
        <li class="edit-mode list-item">
          <input type="checkbox" class="input checkbox">
          <label class="task">Go Shopping</label>
          <input 
            type="text"
            value="Go Shopping"
            class="task input"
          >
          <button class="edit button">Save</button>
          <button class="delete button">
            <img class="img-btn" src="./remove.svg">
          </button>
        </li>
      </ul>
      <h3 class="subtitle">Completed</h3>
      <ul id="completed-tasks" class="todo-list">
        <li class="list-item">
          <input type="checkbox" checked class="input checkbox">
          <label class="task">See the Doctor</label>
          <input type="text" class="task input">
          <button class="edit button">Edit</button>
          <button class="delete button">
            <img class="img-btn" src="./remove.svg">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
